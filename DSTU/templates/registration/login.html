{% extends 'schedule/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <h1>🔐 Вход в систему</h1>
    
    <form method="post" novalidate>
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn">✅ Войти</button>
        
        <div style="margin-top: 1rem;">
            <a href="{% url 'password_reset' %}">Забыли пароль?</a>
        </div>
    </form>
    
    <p style="margin-top: 1rem; text-align: center;">
        Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a>
    </p>
</div>

<style>
    form p {
        margin-bottom: 1rem;
    }
    form label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.25rem;
        color: #333;
    }
    form input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
    }
    form input:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }
    .errorlist {
        color: #dc3545;
        list-style: none;
        padding: 0;
        margin: 0.25rem 0;
        font-size: 0.875rem;
    }
</style>
{% endblock %}
