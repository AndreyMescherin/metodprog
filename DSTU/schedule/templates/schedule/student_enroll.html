<!-- student_enroll.html -->
{% extends 'schedule/base.html' %}

{% block title %}Запись на курс{% endblock %}

{% block content %}
<h1>Запись студента {{ student }} на курс</h1>

<form method="post">
    {% csrf_token %}
    <select name="course_id" required>
        <option value="">Выберите курс</option>
        {% for course in courses %}
        <option value="{{ course.id }}">{{ course.title }} ({{ course.teacher }})</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn">Записать</button>
    <a href="{% url 'schedule:student_detail' student.id %}" class="btn btn-danger">Отмена</a>
</form>
{% endblock %}
