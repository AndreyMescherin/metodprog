<!-- course_form.html -->
{% extends 'schedule/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Сохранить</button>
    <a href="{% url 'schedule:course_index' %}" class="btn btn-danger">Отмена</a>
</form>
{% endblock %}
